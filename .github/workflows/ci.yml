name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a maintainer can re-run the suite without pushing an empty commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The client library is a path dependency, so it has to be on disk beside this one.
      - uses: actions/checkout@v5
        with:
          repository: ergofobe/imogen-sdk
          path: imogen-sdk-checkout
      - name: Put the SDK where Cargo expects it
        run: mv imogen-sdk-checkout ../imogen-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
