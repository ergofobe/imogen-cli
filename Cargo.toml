[package]
name = "imogen-cli"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Command-line client and terminal browser for the imogen photo library"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ergofobe/imogen-cli"
keywords = ["imogen", "photos", "self-hosted", "cli", "tui"]
categories = ["command-line-utilities", "multimedia::images"]
readme = "README.md"

[[bin]]
name = "imogen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
crossterm = "0.28"
dirs = "5"
futures = "0.3"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
  "gif",
  "tiff",
  "bmp",
] }
imogen-sdk = { path = "../imogen-sdk/rust" }
indicatif = "0.17"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "time", "sync", "signal"] }
unicode-width = "0.2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

# Only so the default SIGPIPE handler can be restored: Rust ignores SIGPIPE, which turns
# `imogen ls | head` into a panic instead of a quiet exit.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# --- packaging -------------------------------------------------------------
#
# The completions and the man page are generated into `dist/` by the release
# workflow before either packager runs; both are listed here so a `.deb` and an
# `.rpm` install them in the places a shell and `man` already look.

[package.metadata.deb]
# A GitHub noreply address rather than anybody's own: this ends up in a public
# package's control file. Change it if the project would rather be reachable.
maintainer = "ergofobe <ergofobe@users.noreply.github.com>"
copyright = "The imogen authors"
license-file = ["LICENSE", "0"]
extended-description = """A client for an imogen photo library. Search it, upload to it, download from it, edit what a photograph says about itself, and administer the server — from a shell, from a script, or from an agent. Run with no arguments for a terminal browser that draws photographs using the Kitty graphics protocol."""
section = "graphics"
priority = "optional"
assets = [
  ["target/release/imogen", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/imogen-cli/README.md", "644"],
  ["dist/completions/imogen.bash", "usr/share/bash-completion/completions/imogen", "644"],
  ["dist/completions/imogen.fish", "usr/share/fish/vendor_completions.d/imogen.fish", "644"],
  ["dist/completions/_imogen", "usr/share/zsh/vendor-completions/_imogen", "644"],
  ["dist/man/imogen.1", "usr/share/man/man1/imogen.1", "644"],
]

[package.metadata.generate-rpm]
summary = "Command-line client and terminal browser for the imogen photo library"
license = "AGPLv3+"
assets = [
  { source = "target/release/imogen", dest = "/usr/bin/imogen", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/imogen-cli/README.md", mode = "644", doc = true },
  { source = "LICENSE", dest = "/usr/share/doc/imogen-cli/LICENSE", mode = "644", doc = true },
  { source = "dist/completions/imogen.bash", dest = "/usr/share/bash-completion/completions/imogen", mode = "644" },
  { source = "dist/completions/imogen.fish", dest = "/usr/share/fish/vendor_completions.d/imogen.fish", mode = "644" },
  { source = "dist/completions/_imogen", dest = "/usr/share/zsh/site-functions/_imogen", mode = "644" },
  { source = "dist/man/imogen.1", dest = "/usr/share/man/man1/imogen.1", mode = "644", doc = true },
]
